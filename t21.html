<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Document</title>
	<style>
			.button1 {
					background-color: #FF5733;
					transition: background-color 0.3s;
			}
			.button1:hover {
					background-color: #C70039;
			}
			.button1:active {
					transform: scale(0.95);
			}
			
			.button2 {
					background-color: #33FF57;
					transition: transform 0.3s;
			}
			.button2:hover {
					transform: rotate(10deg);
			}
			.button2:active {
					transform: rotate(-10deg);
			}
			
			.button3 {
					background-color: #3357FF;
					transition: opacity 0.3s;
			}
			.button3:hover {
					opacity: 0.7;
			}
			.button3:active {
					opacity: 1;
			}
			
			.button4 {
					background-color: #FF33A1;
					transition: box-shadow 0.3s;
			}
			.button4:hover {
					box-shadow: 0 0 10px #FF33A1;
			}
			.button4:active {
					box-shadow: none;
			}
			
			.button5 {
					background-color: #A133FF;
					transition: border-radius 0.3s;
			}
			.button5:hover {
					border-radius: 20px;
			}
			.button5:active {
					border-radius: 0;
			}
	</style>
</head>
<body>
	<button class="button1">Кнопка 1</button>
<button class="button2">Кнопка 2</button>
<button class="button3">Кнопка 3</button>
<button class="button4">Кнопка 4</button>
<button class="button5">Кнопка 5</button>
</body>
</html>
